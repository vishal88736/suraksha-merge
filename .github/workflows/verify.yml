name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s research -p "test_*.py" -v
      - run: npm run build
      - name: Verify built Worker over HTTP
        timeout-minutes: 3
        env:
          TRIAGE_SMOKE_API_KEY: local-smoke-fixture-only
        run: |
          node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js dev --config dist/server/wrangler.json --local --ip 127.0.0.1 --inspector-port 0 --port 8791 --var TRIAGE_API_KEY:local-smoke-fixture-only --log-level error > /tmp/suraksha-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8791/api/health; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -80 /tmp/suraksha-worker.log
            exit 1
          fi
          node scripts/smoke-http.mjs http://127.0.0.1:8791
